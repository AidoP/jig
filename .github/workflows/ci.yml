name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # the minimum supported Rust version, which the README gives too
  MSRV: "1.95"

jobs:
  test:
    name: test (${{ matrix.toolchain }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # `ubuntu-24.04-riscv` is a RISE RISC-V runner, which needs its GitHub App installed for the repository, while
        # `macos-latest` is Apple silicon and `macos-15-intel` is x86_64
        os: [ubuntu-latest, ubuntu-24.04-arm, ubuntu-24.04-riscv, macos-latest, macos-15-intel]
        toolchain: [stable, msrv]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install rustup
        # the RISC-V runners may not have it
        run: |
          if ! command -v rustup >/dev/null; then
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
      - name: Install the toolchains
        # the tests of custom targets use nightly as well
        run: |
          toolchain=${{ matrix.toolchain }}
          if [ "$toolchain" = msrv ]; then toolchain=$MSRV; fi
          rustup toolchain install "$toolchain" nightly --profile minimal
          echo "RUSTUP_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"
      - name: Install ninja
        run: |
          if ! command -v ninja >/dev/null; then
            if [ "$RUNNER_OS" = macOS ]; then
              brew install ninja
            else
              sudo apt-get update && sudo apt-get install -y ninja-build
            fi
          fi
      - name: Bootstrap
        run: ninja -f bootstrap.ninja
      - name: Build
        run: build/bootstrap/jig build
      - name: Test
        run: build/bootstrap/jig test
