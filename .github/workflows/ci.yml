name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # the minimum supported Rust version, which the README gives too
  MSRV: "1.97"
  # a toolchain which is not installed fails at once, rather than rustup downloading it, which in a test may stall
  RUSTUP_AUTO_INSTALL: "0"

jobs:
  test:
    name: test (${{ matrix.toolchain }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # `ubuntu-24.04-riscv` is a RISE RISC-V runner, which needs its GitHub App installed for the repository, while
        # `macos-latest` is Apple silicon and `macos-15-intel` is x86_64
        os: [ubuntu-latest, ubuntu-24.04-arm, ubuntu-24.04-riscv, macos-latest, macos-15-intel]
        toolchain: [stable, msrv]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install rustup
        # the RISC-V runners may not have it
        run: |
          if ! command -v rustup >/dev/null; then
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
      - name: Install the toolchains
        # the tests of custom targets use nightly as well, and those of `jig lint` use clippy
        run: |
          toolchain=${{ matrix.toolchain }}
          if [ "$toolchain" = msrv ]; then toolchain=$MSRV; fi
          rustup toolchain install "$toolchain" nightly --profile minimal --component clippy
          echo "RUSTUP_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"
      # without ninja, which rig, the default engine, does not need
      - name: Bootstrap
        run: sh bootstrap.sh
      - name: Build
        run: build/bootstrap/jig build
      - name: Test
        # every test, including the performance tests, which `jig test` leaves out by their tag, which take about 10
        # minutes on the slowest runners, so that a hang stops the job well before GitHub's limit of 6 hours, once what
        # is still running has been shown
        timeout-minutes: 30
        run: |
          # a second at a time, so that nothing is left once it is stopped
          (i=0; while [ "$i" -lt 1200 ]; do sleep 1; i=$((i + 1)); done; sh .github/hang-report.sh) &
          watchdog=$!
          status=0
          build/bootstrap/jig test --all || status=$?
          kill "$watchdog" 2>/dev/null || true
          exit "$status"
        env:
          # the budgets of the performance tests are for a fast machine, while their scaling is checked regardless
          JIG_PERF_SCALE: ${{ matrix.os == 'ubuntu-24.04-riscv' && '10' || '4' }}

  ninja:
    # the suite with ninja as the engine, which also compares rig with ninja, in the differential and performance tests
    name: test with ninja
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the toolchains
        run: |
          rustup toolchain install stable nightly --profile minimal --component clippy
          echo "RUSTUP_TOOLCHAIN=stable" >> "$GITHUB_ENV"
      - name: Install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Bootstrap
        # which configures the project for ninja, as `JIG_ENGINE` chooses, so that it writes `build.ninja`
        run: sh bootstrap.sh
        env:
          JIG_ENGINE: ninja
      - name: Test
        timeout-minutes: 30
        run: |
          # a second at a time, so that nothing is left once it is stopped
          (i=0; while [ "$i" -lt 1200 ]; do sleep 1; i=$((i + 1)); done; sh .github/hang-report.sh) &
          watchdog=$!
          status=0
          build/bootstrap/jig test --all || status=$?
          kill "$watchdog" 2>/dev/null || true
          exit "$status"
        env:
          JIG_ENGINE: ninja
          JIG_PERF_SCALE: 4

  windows-native:
    # rig and jig built and tested on Windows itself, for what Wine is not, as console events, job objects, locking
    # files and paths, with MSVC, and the integration tests, but for those which read `build.ninja`, make symbolic links,
    # set modes or run POSIX shell, which run commands from coreutils, as Git for Windows has them on `PATH` in its bash
    name: test (stable, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Git's bash, which runs `bootstrap.sh`
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Install the toolchains
        # the tests of custom targets use nightly as well
        run: |
          rustup toolchain install stable nightly --profile minimal
          echo "RUSTUP_TOOLCHAIN=stable" >> "$GITHUB_ENV"
      - name: Bootstrap
        run: sh bootstrap.sh
      - name: Test
        timeout-minutes: 30
        run: build/bootstrap/jig test rig jig integration

  windows:
    # rig and jig built for Windows with MinGW, and their tests run with Wine, as they are developed, linted as well,
    # while those whose commands are POSIX shell are ignored there
    name: test for Windows with Wine
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Wine, MinGW and the target
        run: |
          sudo apt-get update && sudo apt-get install -y wine64 gcc-mingw-w64-x86-64
          rustup toolchain install stable --profile minimal --component clippy --target x86_64-pc-windows-gnu
          echo "RUSTUP_TOOLCHAIN=stable" >> "$GITHUB_ENV"
      - name: Configure the target
        # with `Jig.local`, which `Jig` uses if it exists, as for development
        run: |
          cat > Jig.local <<EOF
          set targets [host-target, 'x86_64-pc-windows-gnu']
          target x86_64-pc-windows-gnu
              override
              linker 'x86_64-w64-mingw32-gcc'
              runner '/usr/lib/wine/wine64'
          EOF
      - name: Bootstrap
        run: sh bootstrap.sh
      - name: Test
        timeout-minutes: 30
        run: build/bootstrap/jig test rig@x86_64-pc-windows-gnu jig@x86_64-pc-windows-gnu
        env:
          WINEDEBUG: -all
      - name: Lint
        run: build/bootstrap/jig lint -D

  lint:
    # on one machine, with the latest clippy, as its lints change between versions
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          echo "RUSTUP_TOOLCHAIN=stable" >> "$GITHUB_ENV"
      - name: Bootstrap
        run: sh bootstrap.sh
      - name: Lint
        # any warning fails, as the levels of the lints, set in `Jig`, are those the project keeps to
        run: build/bootstrap/jig lint -D
      - name: Test rig with cargo
        # so that cargo projects can use rig as a git or path dependency
        run: cargo test --manifest-path rig/Cargo.toml
